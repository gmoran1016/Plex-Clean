[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-clean"
version = "0.1.0"
description = "A self-hosted Plex duplicate review app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
